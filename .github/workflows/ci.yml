name: CI

# Every push and pull request, forks included: syntax, the sensitive-data scan,
# unit tests and the browser tests. No secrets needed — the browser tests serve
# their own pages.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The container runs as root, the checkout belongs to the runner's user:
      # git refuses the repository ("dubious ownership") until told it is safe.
      # The sensitive-data scan lists files through git.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node scripts/check-syntax.mjs

      - name: Sensitive-data scan
        env:
          SENSITIVE_DENYLIST: ${{ secrets.SENSITIVE_DENYLIST }}
        run: node scripts/sensitive-scan.mjs

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:e2e -- --reporter=list

      # The browser tests use made-up data only, so their report is safe to publish.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
